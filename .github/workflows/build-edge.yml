name: Synthesize & Build Bleeding Edge Release (indi-allsky-edge)

on:
  schedule:
    # Nightly compilation at 02:00 UTC
    - cron: '0 2 * * *'
  push:
    branches:
      - main
    paths:
      - 'manifest.yaml'
      - 'rebuild.py'
      - 'patches/**'
      - 'rr-cache/**'
  workflow_dispatch:
    inputs:
      force_push:
        description: 'Force push edge branch even if identical'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

env:
  PACKAGE_NAME: 'indi-allsky-edge'
  INDI_CORE_TAG: 'v2.2.4.2'
  INDI_3RDPARTY_TAG: 'v2.2.4.1'

jobs:
  # ============================================================================
  # Stage 1: Synthesize Ephemeral Edge Branch
  # ============================================================================
  synthesize-edge:
    name: Synthesize Edge Branch
    runs-on: ubuntu-latest
    outputs:
      edge_sha: ${{ steps.synthesize.outputs.edge_sha }}
    steps:
      - name: Checkout Orchestration Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pyyaml

      - name: Configure Git Identity
        run: |
          git config --global user.name "indi-allsky-edge CI"
          git config --global user.email "ci@indi-allsky-edge.internal"

      - name: Run Rebuild Engine
        id: synthesize
        env:
          PUSH_TOKEN: ${{ secrets.EDGE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python3 rebuild.py --workspace workspace --target-branch edge

          cd workspace
          EDGE_SHA=$(git rev-parse HEAD)
          echo "edge_sha=${EDGE_SHA}" >> $GITHUB_OUTPUT
          
          # Push synthesized edge branch to this repository
          git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${{ github.repository }}.git"
          git push --force origin edge

      - name: Commit Updated Rerere Resolutions (if any recorded)
        run: |
          if [ -n "$(git status --porcelain rr-cache/)" ]; then
            git add rr-cache/
            git commit -m "chore(rerere): update recorded resolutions from build run"
            git push origin main
          fi

